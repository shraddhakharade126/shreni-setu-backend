server.port=${PORT:8080}
spring.application.name=shreni-setu-backend

# Firebase Configuration
# Path to service account JSON (optional if using Google Application Default Credentials or Emulator)
firebase.config.path=${FIREBASE_CONFIG_PATH:}
firebase.project-id=${FIREBASE_PROJECT_ID:shreni-setu-prod}
firebase.emulator.enabled=${FIREBASE_EMULATOR_ENABLED:false}
firebase.emulator.host=${FIREBASE_EMULATOR_HOST:localhost:9099}
firestore.emulator.host=${FIRESTORE_EMULATOR_HOST:localhost:8080}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://shreni-setu-crafts.lovable.app}

# Actuator & Observability
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OpenAPI Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
